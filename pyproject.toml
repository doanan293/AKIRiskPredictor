[project]
name = "aki-risk-predictor"
version = "0.1.0"
description = "Predict acute kidney injury in ICU patients with diabetic ketoacidosis (MIMIC-IV)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Doan Van An", email = "andoan020903@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "optuna>=3.6",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "tabulate>=0.9",
    "typer>=0.12",
    "xgboost>=2.0",
]

[project.optional-dependencies]
tabpfn = ["tabpfn>=8.0", "torch>=2.4"]

[project.scripts]
aki = "aki_risk_predictor.cli:app"

[dependency-groups]
dev = ["pandas-stubs", "pre-commit", "pyrefly", "pytest", "ruff", "types-PyYAML"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "N", "C4", "PERF", "RET", "TRY",
    "ARG", "ERA", "S", "T20", "DTZ", "BLE", "FBT", "TID",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pep8-naming]
# X and y are the scikit-learn conventions for features and labels
ignore-names = ["X", "X_*", "*_X"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "FBT", "PLC0415", "N803", "N806"]
"src/aki_risk_predictor/cli.py" = ["T20", "FBT001", "FBT002", "PLR0913", "PLR0917"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-interpreter-path = ".venv/bin/python"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: long-running experiments, skipped in CI"]
